name: Publish to Nexus Mods

# Mirrors the AndroidConsolizer pipeline: a published GitHub release auto-uploads
# its ZIP asset to the Cart Catalog Nexus page via the official upload-action.
#
# SETUP (one-time, after the Nexus mod page exists):
#   1. Replace __MOD_ID__ below with the numeric Cart Catalog mod ID (the number in the page URL).
#   2. Add the repo secret:  gh secret set NEXUS_API_KEY --repo sonofskywalker3/CartCatalog
#      (value = your Nexus v3 Upload API key, e.g. from ~/.nexus_api_key)
#
# After setup, `gh release create vX.Y.Z "<zip>"` triggers this and uploads automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.9.0). Leave empty for latest release.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh release view --json tagName -q '.tagName')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip leading 'v' for the Nexus version string
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download release asset
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern '*.zip' \
            --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find ZIP file
        id: zip
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "path=$ZIP" >> $GITHUB_OUTPUT
          echo "Found: $ZIP"

      - name: Upload to Nexus Mods
        # Pinned to the v3-migration merge (post-migration main as of 2026-07-13).
        # The v3 mod-file id equals our old file_group_id — verified via TLY's
        # read-only nexus-v3-probe workflow (GET /v3/mods/5596342433834/files:
        # 7497950 is this mod's single active file). The first file for mod 47146
        # was created via tools/nexus-upload.mjs (POST /mod-files); every release
        # attaches a new version to it. Rollback if a release fails: pre-migration
        # pin ee1af4be8e1be6773ab5aeb02bacc6d638b20deb with the old
        # file_group_id/file_category/archive_existing_file inputs (until 2026-09-09).
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          # v3 mod-file id (NOT the mod ID, NOT a per-version fileId). Stays stable
          # across version updates; new versions attach to it.
          file_id: 7497950
          filename: ${{ steps.zip.outputs.path }}
          version: ${{ steps.release.outputs.version }}
          category: main
          archive_existing_version: true
